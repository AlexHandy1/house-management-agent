[pytest]
addopts = -m "not eval and not e2e"
markers =
    eval: makes real network calls to third-party LLM providers, costs money, excluded by default. Run explicitly: pytest -m eval.
    e2e: drives the app through a real browser (agent-browser); needs Postgres, the backend and the frontend already running locally, and costs money via the real agent run. Excluded by default. Run explicitly: pytest -m e2e.
