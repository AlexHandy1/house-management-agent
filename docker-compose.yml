# Local development/test Postgres ONLY. The credentials below are a throwaway local
# dev value, not the production password (production's lives in Secret Manager and is
# never committed — see docs/specs/spec-architecture-research-cost-agent-and-issues-db-280926.md).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: house_mgmt
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
